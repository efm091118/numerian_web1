services:
  - type: web
    name: numerian-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node start-render.cjs
    healthCheckPath: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECURE_COOKIES
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
